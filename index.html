<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Lab</title>
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <header class="hub-top">
    <h1>TRAINING LAB</h1>
    <span class="muted" style="color:#ccc">Handel's register</span>
  </header>

  <main class="hub-main">
    <!-- Who is training -->
    <section class="panel" id="who-panel"></section>

    <!-- Modes -->
    <section class="panel">
      <div class="modes">
        <a class="mode play" href="register.html?mode=playground">
          <h3>Playground</h3>
          <p>Practice on the register. No score, no pressure. Explore everything.</p>
        </a>
        <a class="mode" href="#challenges" id="challenge-card">
          <h3>Challenge</h3>
          <p>A customer gives you an order. Ring it right, take payment, get a score.</p>
        </a>
        <a class="mode manager" href="manager.html">
          <h3>Manager</h3>
          <p>See every trainee's scores, mistakes, and readiness.</p>
        </a>
      </div>
    </section>

    <!-- Challenges -->
    <section class="panel" id="challenges">
      <h2>Challenges</h2>
      <p class="muted" id="challenge-note"></p>
      <ul class="challenge-list" id="challenge-list"></ul>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="engine/storage.js"></script>
  <script src="engine/scoring.js"></script>
  <script src="scenarios/handels.js"></script>
  <script>
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function renderWho() {
      const panel = document.getElementById("who-panel");
      const t = Storage.getTrainee();
      if (t) {
        panel.innerHTML = `
          <div class="name-row">
            <div class="who" style="flex:1">Training as <strong>${esc(t.name)}</strong></div>
            <button class="btn gray small" id="switch">Not you?</button>
          </div>`;
        document.getElementById("switch").onclick = () => editName(t.name);
      } else {
        editName("");
      }
      renderChallenges();
    }

    function editName(current) {
      const panel = document.getElementById("who-panel");
      panel.innerHTML = `
        <h2>Who's training?</h2>
        <p class="muted">First name and last initial only, like "Alex B."</p>
        <form class="name-row" id="name-form">
          <input id="name" autocomplete="off" maxlength="40" placeholder="First name + last initial" value="${esc(current)}" />
          <button class="btn green" type="submit">Start training</button>
        </form>`;
      document.getElementById("name-form").onsubmit = e => {
        e.preventDefault();
        if (Storage.setTrainee(document.getElementById("name").value)) renderWho();
        else document.getElementById("name").focus();
      };
      document.getElementById("name").focus();
      renderChallenges();
    }

    function renderChallenges() {
      const t = Storage.getTrainee();
      const mine = t ? Storage.listAttempts().filter(a => a.trainee && a.trainee.id === t.id) : [];
      const list = document.getElementById("challenge-list");
      const passedCount = Scenarios.list.filter(s => mine.some(a => a.scenarioId === s.id && a.passed)).length;

      document.getElementById("challenge-note").textContent = t
        ? `${passedCount} of ${Scenarios.list.length} passed. Pass = right order, right payment, and 80+ points.`
        : "Enter your name above to start challenges.";

      list.innerHTML = Scenarios.list.map(s => {
        const tries = mine.filter(a => a.scenarioId === s.id);
        const best = tries.reduce((b, a) => Math.max(b, a.score), -1);
        const passed = tries.some(a => a.passed);
        const badge = !tries.length ? `<span class="badge">New</span>`
          : passed ? `<span class="badge pass">Passed · best ${best}</span>`
          : `<span class="badge fail">Best ${best}</span>`;
        const href = `register.html?mode=challenge&scenario=${encodeURIComponent(s.id)}`;
        return `
          <li>
            <div class="info">
              <div class="title">${esc(s.title)}</div>
              <div class="meta">${"★".repeat(s.difficulty)}${"☆".repeat(3 - s.difficulty)} · goal ${s.targetSeconds}s${tries.length ? ` · ${tries.length} tr${tries.length === 1 ? "y" : "ies"}` : ""}</div>
            </div>
            ${t ? badge : ""}
            ${t ? `<a class="btn small" href="${href}">Play</a>` : `<button class="btn small" disabled>Play</button>`}
          </li>`;
      }).join("");
    }

    renderWho();
  </script>
</body>
</html>
