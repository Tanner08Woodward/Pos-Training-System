<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe6" />
  <title>Manager · Training Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&display=swap" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="manager.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11a5 5 0 0 1 10 0"/><path d="M6.5 11h11L12 22z"/></svg></span><span><b>Training Lab</b><small>Manager</small></span></a>
    <a class="btn ghost small" href="index.html">Training Lab</a>
  </header>
  <div class="shell">
    <nav class="side" aria-label="Manager">
      <a class="brand" href="index.html"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11a5 5 0 0 1 10 0"/><path d="M6.5 11h11L12 22z"/></svg></span><span><b>Training Lab</b><small>Handel's · Manager</small></span></a>
      <button class="nav-item on" data-nav="team" type="button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Overview</span></button>
      <button class="nav-item" data-nav="trainees" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Trainees</span></button>
      <button class="nav-item" data-nav="sessions" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z"/></svg><span>Sessions</span></button>
      <button class="nav-item" data-nav="manage" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>Manage</span></button>
      <div class="side-foot">
        <a class="nav-item" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Training Lab</span></a>
      </div>
    </nav>
    <div class="main"><main class="page" id="app"></main></div>
  </div>

  <script src="config.js"></script>
  <script src="engine/storage.js"></script>
  <script src="engine/scoring.js"></script>
  <script src="scenarios/handels.js"></script>
  <script src="lessons/handels.js"></script>
  <script>
    // Manager workspace. Areas: Overview, Trainees (progress grid), Sessions
    // (replays) and Manage (codes + data). Drill-down: trainee -> attempt
    // (tap-by-tap replay). Data: the shared database (needs the manager
    // code), plus anything on this device not sent yet.

    const app = document.getElementById("app");
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const when = iso => new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    const day = iso => new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" });
    const pct = (n, d) => d ? Math.round((100 * n) / d) : 0;
    const CODE_KEY = "ptl.managerCode";

    // Database results are untrusted input, even when retrieved with a code.
    // Normalize numbers before interpolation; escape all displayed strings.
    const num = (value, max = 1000000) => typeof value === "number" && Number.isFinite(value)
      ? Math.max(0, Math.min(max, value)) : 0;
    const array = value => Array.isArray(value) ? value : [];
    const object = value => value && typeof value === "object" && !Array.isArray(value) ? value : {};
    function normalizeAttempt(value) {
      const a = object(value), t = object(a.trainee), points = object(a.points);
      if (typeof a.id !== "string" || typeof t.id !== "string" || typeof t.name !== "string") return null;
      return {
        ...a, trainee: { id: t.id, name: t.name },
        storeId: typeof a.storeId === "string" ? a.storeId : typeof t.storeId === "string" ? t.storeId : "",
        storeName: typeof a.storeName === "string" ? a.storeName : typeof t.storeName === "string" ? t.storeName : "",
        mode: a.mode === "lesson" ? "lesson" : "challenge",
        scenarioId: String(a.scenarioId || ""), scenarioTitle: String(a.scenarioTitle || "Untitled attempt"),
        finishedAt: typeof a.finishedAt === "string" ? a.finishedAt : "",
        score: num(a.score, 100), passed: a.passed === true,
        seconds: num(a.seconds), stars: Math.floor(num(a.stars, 3)),
        hintsNeeded: num(a.hintsNeeded), wrongTaps: num(a.wrongTaps),
        points: { accuracy: num(points.accuracy, 50), payment: num(points.payment, 20),
          corrections: num(points.corrections, 15), speed: num(points.speed, 15) },
        mistakes: array(a.mistakes).map(m => ({ code: String(object(m).code || ""), text: String(object(m).text || "") })),
        feedback: array(a.feedback).map(f => ({ ok: object(f).ok === true, text: String(object(f).text || "") })),
        expected: array(a.expected).map(String), rung: array(a.rung).map(String),
        events: array(a.events).map(e => ({ type: String(object(e).type || ""), t: num(object(e).t), data: object(object(e).data) })),
      };
    }
    const normalizeAttempts = data => array(data).map(normalizeAttempt).filter(Boolean);

    // Plain-language names for each mistake the scoring can find.
    const PROBLEMS = {
      wrong_size: "Rings the wrong size",
      wrong_type: "Rings the wrong cone/cup type",
      missed_addon: "Misses add-ons (dipped, toppings)",
      missing_item: "Leaves items off the order",
      extra_item: "Rings items that weren't ordered",
      no_payment: "Finishes sales without payment",
      wrong_payment_method: "Uses the wrong payment type",
      wrong_tender_amount: "Enters the wrong cash amount",
      extra_deletes: "Deletes more than needed",
      slow: "Slower than the goal time",
      missed_change: "Misses when the customer changes their mind",
    };
    const problem = code => Object.prototype.hasOwnProperty.call(PROBLEMS, code) ? PROBLEMS[code] : code;

    // Which lesson helps with which problem.
    const PRACTICE = {
      wrong_size: "sizes", wrong_type: "sizes", missed_addon: "dipped", missing_item: "register-tour",
      extra_item: "fixing-mistakes", extra_deletes: "fixing-mistakes", no_payment: "payment",
      wrong_payment_method: "payment", wrong_tender_amount: "payment", missed_change: "fixing-mistakes",
    };

    let ALL = [];          // every attempt (challenges + lessons)
    let SOURCE = "device"; // "database" or "device"
    let SOURCE_WARNING = "";
    let ROSTER = null;     // trainees with codes (null = codes not set up)
    let STORES = [];       // [{ id, name }]
    const FILTER_KEY = "ptl.managerStore";
    function getFilter() { try { return sessionStorage.getItem(FILTER_KEY) || ""; } catch (e) { return ""; } }
    function setFilter(id) { try { sessionStorage.setItem(FILTER_KEY, id); } catch (e) {} }

    function sourceBanner() {
      const local = SOURCE === "device";
      const pending = Storage.pendingCount(), rejected = Storage.rejectedCount();
      return (local ? `<section class="banner" role="alert"><strong>Device-only results — other devices are missing.</strong><p>${esc(SOURCE_WARNING || "Shared results are unavailable. This is not the complete team report.")}</p></section>` : "") +
        (pending || rejected ? `<section class="banner" role="status"><strong>Some results from this device haven't reached the manager.</strong><p>${pending} waiting to send · ${rejected} rejected. Keep this device's browser data until the results are recovered.</p></section>` : "");
    }

    function getCode() {
      try { return sessionStorage.getItem(CODE_KEY); } catch (e) { return null; }
    }
    function setCode(code) {
      try { code ? sessionStorage.setItem(CODE_KEY, code) : sessionStorage.removeItem(CODE_KEY); } catch (e) {}
    }

    // ---- Loading data --------------------------------------------------------
    function mergeWithLocal(remote) {
      const ids = new Set(remote.map(a => a.id));
      return remote.concat(Storage.listAttempts().filter(a => !ids.has(a.id)));
    }

    async function load() {
      if (!Storage.remoteEnabled) {
        ALL = normalizeAttempts(Storage.listAttempts());
        SOURCE = "device";
        SOURCE_WARNING = "Shared saving isn't connected. This is not the complete team report.";
        return showOverview();
      }
      const code = getCode();
      if (!code) return showLogin();
      app.innerHTML = `<p class="empty">Loading results…</p>`;
      try {
        await Storage.syncPending();
        ALL = normalizeAttempts(mergeWithLocal(await Storage.fetchAllAttempts(code)));
        SOURCE = "database";
        SOURCE_WARNING = "";
        await loadRoster(code);
        showOverview();
      } catch (err) {
        if (/wrong code/i.test(err.message)) {
          setCode(null);
          return showLogin("That code didn't work.");
        }
        ALL = normalizeAttempts(Storage.listAttempts());
        SOURCE = "device";
        const why = err.status === 404
          ? "The shared database isn't set up yet: run supabase/schema.sql in the Supabase SQL Editor."
          : `Couldn't reach the shared database (${err.message}).`;
        SOURCE_WARNING = why;
        showOverview();
      }
    }

    // Trainee codes and stores. Missing functions (404) = 003_trainee_codes.sql
    // hasn't been run yet; the rest of the dashboard still works.
    async function loadRoster(code) {
      try {
        const [stores, roster] = await Promise.all([Storage.fetchStores(code), Storage.fetchTrainees(code)]);
        STORES = array(stores).map(x => ({ id: String(object(x).id || ""), name: String(object(x).name || "") })).filter(x => x.id);
        ROSTER = array(roster).map(x => object(x)).filter(x => typeof x.id === "string").map(x => ({
          id: x.id, name: String(x.name || ""), code: String(x.code || ""), active: x.active === true,
          storeId: String(x.storeId || ""), storeName: String(x.storeName || ""),
        }));
      } catch (err) {
        ROSTER = null;
        STORES = [];
      }
    }

    function showLogin(error) {
      app.innerHTML = `
        <section class="card login rise">
          <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11a5 5 0 0 1 10 0"/><path d="M6.5 11h11L12 22z"/></svg></span>
          <h2>Manager sign-in</h2>
          <p class="sub">Enter the manager code to see every trainee's results.</p>
          ${error ? `<p class="err">${esc(error)}</p>` : ""}
          <form id="login">
            <input class="input" id="code" type="password" autocomplete="current-password" placeholder="Manager code" />
            <button class="btn" type="submit">Show results</button>
          </form>
        </section>`;
      document.getElementById("login").onsubmit = e => {
        e.preventDefault();
        const code = document.getElementById("code").value.trim();
        if (!code) return;
        setCode(code);
        load();
      };
      document.getElementById("code").focus();
    }

    // ---- Working out each trainee's status -----------------------------------
    function trainees() {
      const map = new Map();
      // Everyone with a trainee code shows up, even before their first try.
      (ROSTER || []).filter(r => r.active).forEach(r => map.set(r.id, { trainee: { id: r.id, name: r.name }, attempts: [], storeId: r.storeId, storeName: r.storeName }));
      ALL.forEach(a => {
        if (!a.trainee) return;
        if (!map.has(a.trainee.id)) map.set(a.trainee.id, { trainee: a.trainee, attempts: [], storeId: "", storeName: "" });
        const g = map.get(a.trainee.id);
        g.attempts.push(a);
        if (!g.storeId && a.storeId) { g.storeId = a.storeId; g.storeName = a.storeName; }
      });
      const filter = getFilter();
      return [...map.values()].filter(g => !filter || g.storeId === filter).map(summarize);
    }

    // Counts how many attempts had each mistake (once per attempt).
    function countProblems(list, skipSlow) {
      const counts = Object.create(null);
      list.forEach(a => new Set((a.mistakes || []).map(m => m.code)).forEach(c => {
        if (skipSlow && c === "slow") return;
        counts[c] = (counts[c] || 0) + 1;
      }));
      return Object.entries(counts).sort((a, b) => b[1] - a[1]);
    }

    // Accuracy and speed are measured separately from the overall score:
    // accurate = right items + right payment (from the scoring's mistake codes);
    // on time = no "slow" mistake (finished within the scenario's goal time).
    const ACCURACY_CODES = new Set(["wrong_size", "wrong_type", "missed_addon", "missing_item", "extra_item",
      "missed_change", "no_payment", "wrong_payment_method", "wrong_tender_amount"]);
    const isAccurate = a => !(a.mistakes || []).some(m => ACCURACY_CODES.has(m.code));
    const isOnTime = a => !(a.mistakes || []).some(m => m.code === "slow");
    const MIN_TRIES = 3;   // fewer tries than this = not enough to judge a percentage
    const CHART_MIN = 5;   // a trend chart needs at least this many tries

    function median(values) {
      if (!values.length) return 0;
      const s = values.slice().sort((a, b) => a - b), m = Math.floor(s.length / 2);
      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    }

    function summarize(g) {
      const all = g.attempts.slice().sort((x, y) => x.finishedAt.localeCompare(y.finishedAt));
      const challenges = all.filter(a => a.mode !== "lesson");
      const lessons = all.filter(a => a.mode === "lesson");
      const lessonsDone = Lessons.list.filter(l => lessons.some(a => a.scenarioId === l.id));
      const passed = Scenarios.list.filter(s => challenges.some(a => a.scenarioId === s.id && a.passed));
      // "slow" isn't a skill problem. "problems" = the last 5 challenges (what's
      // going wrong lately); "allProblems" = everything, for the detail page.
      const recent = challenges.slice(-5);
      const problems = countProblems(recent, true);
      const allProblems = countProblems(challenges, true);
      const recentFails = recent.filter(a => !a.passed).length;
      const repeated = problems.length && problems[0][1] >= 3;

      // "Practice complete" uses only current lesson/challenge versions and
      // the LATEST try of each challenge, so an old pass can't hide recent
      // failures. It is not a readiness prediction: a trainer still decides
      // when someone is ready for the live register.
      const isCurrent = (a, item) => a.scenarioId === item.id && num(a.scenarioVersion) === item.version;
      const lessonsSolid = Lessons.list.filter(l => lessons.some(a => isCurrent(a, l) && a.stars >= 2));
      const challengesClear = Scenarios.list.filter(s => {
        const tries = challenges.filter(a => isCurrent(a, s));
        return tries.length && tries[tries.length - 1].passed;
      });

      let status;
      if (!all.length) status = "new";
      else if (recent.length >= 3 && (recentFails >= 3 || repeated)) status = "help";
      else if (lessonsSolid.length === Lessons.list.length && challengesClear.length === Scenarios.list.length) status = "ready";
      else status = "training";

      return {
        ...g, all, challenges, lessons, lessonsDone, passed, lessonsSolid, challengesClear, problems, allProblems, recent, status,
        accurate: challenges.filter(isAccurate).length,
        onTime: challenges.filter(isOnTime).length,
        medianSeconds: median(challenges.map(a => a.seconds)),
        last: all.length ? all[all.length - 1].finishedAt : null,
      };
    }

    const STATUS = {
      ready: ["✓", "Practice complete"],
      training: ["●", "In training"],
      help: ["!", "Needs coaching"],
      new: ["○", "Not started"],
    };
    const pill = (cls, icon, word) => `<span class="status ${esc(cls)}"><span aria-hidden="true">${esc(icon)}</span>${esc(word)}</span>`;
    const statusPill = s => pill(s, STATUS[s][0], STATUS[s][1]);
    const tries = n => `${n} tr${n === 1 ? "y" : "ies"}`;
    const stars = n => `<span class="stars" title="${n} of 3 stars">${"★".repeat(n)}<span>${"★".repeat(3 - n)}</span></span>`;
    const AVATARS = [["#e8ecfb", "#1b34a3"], ["#efe8fb", "#5b3aa8"], ["#e0f0ef", "#1d6a69"], ["#f3eadb", "#7a5524"]];
    function avatar(name, big) {
      const s = String(name);
      const hue = AVATARS[[...s].reduce((h, c) => h + c.charCodeAt(0), 0) % AVATARS.length];
      const ini = s.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
      return `<span class="avatar ${big ? "lg" : ""}" style="--av-bg:${hue[0]};--av-fg:${hue[1]}" aria-hidden="true">${esc(ini)}</span>`;
    }
    const ICON = {
      play: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>`,
      chev: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>`,
      people: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
      check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>`,
      coach: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v4M12 14h.01"/></svg>`,
      cap: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>`,
      search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
    };
    const replayBtn = (id, label) => `<button class="play" type="button" data-attempt="${esc(id)}" title="Replay" aria-label="Replay ${esc(label)}">${ICON.play}</button>`;

    // A percentage that always carries its count, and says so when the count
    // is too small to mean anything (so "100%" from 1 try never looks good).
    function rate(n, d, unit) {
      n = num(n); d = num(d);
      if (!d) return `<div class="metric none">No ${esc(unit)} yet</div>`;
      const thin = d < MIN_TRIES;
      return `<div class="metric ${thin ? "thin" : ""}" title="${n} of ${d} ${esc(unit)}${thin ? " (too few to judge)" : ""}">
        <div class="mv"><span class="num">${pct(n, d)}%</span><span>${n} of ${d}</span></div>
        <div class="track"><div class="fill grow" style="width:${pct(n, d)}%"></div></div>${thin ? `<span class="few">Too few to judge</span>` : ""}</div>`;
    }
    // Seven pips, one per lesson: solid = 2+ stars, striped = tried but under 2 stars.
    function pips(p) {
      return `<div class="pips" aria-hidden="true">${Lessons.list.map(l =>
        `<i class="${p.lessonsSolid.includes(l) ? "done" : p.lessonsDone.includes(l) ? "part" : ""}"></i>`).join("")}</div>`;
    }

    function ago(iso) {
      if (!iso) return "";
      const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return `${hrs} hr ago`;
      const days = Math.round(hrs / 24);
      return days === 1 ? "yesterday" : days < 30 ? `${days} days ago` : day(iso);
    }

    function suggestion(p) {
      const lesson = p.problems.length && Lessons.get(PRACTICE[p.problems[0][0]]);
      return lesson ? `Suggest the <b>${esc(lesson.title)}</b> lesson.` : "";
    }

    // What this trainee should do next, in a few words, plus a reason.
    function nextStep(p) {
      if (p.status === "new") return ["Start the Register tour", "No practice yet"];
      if (p.status === "help") {
        const code = p.problems.length ? p.problems[0][0] : "";
        const lesson = Lessons.get(PRACTICE[code]);
        return [lesson ? `Coach, then redo ${lesson.title}` : "Coach on the last few challenges", code ? problem(code) : "Several recent fails"];
      }
      const l = Lessons.list.find(x => !p.lessonsSolid.includes(x));
      if (l) return [`Lesson: ${l.title}`, `${p.lessonsSolid.length} of ${Lessons.list.length} lessons done`];
      const s = Scenarios.list.find(x => !p.challengesClear.includes(x));
      if (s) return [`Challenge: ${s.title}`, p.challenges.some(a => a.scenarioId === s.id) ? "Latest try didn't pass" : "Not tried yet"];
      return ["Live register sign-off", "All practice complete"];
    }

    // ---- Navigation + filters -------------------------------------------------------
    // Areas: team overview, trainees (progress grid), sessions, manage.
    let TAB = "team";
    let QUERY = "";        // roster search text
    let SHOW = "all";      // roster status filter
    let FEED = "all";      // sessions tab filter
    let PERIOD = 30;       // days of practice used by the analytics (0 = all time)
    let PLAYER = null;     // replay animation timer
    const PERIODS = [[7, "Last 7 days"], [30, "Last 30 days"], [0, "All time"]];

    function setNav(which) {
      document.querySelectorAll("[data-nav]").forEach(b => {
        const on = b.dataset.nav === which;
        b.classList.toggle("on", on);
        if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
      });
    }
    document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { TAB = b.dataset.nav; showOverview(); });
    function stopPlayer() { if (PLAYER) { clearTimeout(PLAYER); PLAYER = null; } }
    const inPeriod = a => !PERIOD || Date.now() - new Date(a.finishedAt).getTime() <= PERIOD * 864e5;
    const periodLabel = () => PERIODS.find(p => p[0] === PERIOD)[1].toLowerCase();

    function headTools(filter, id) {
      return `<div class="head-tools">
        ${STORES.length ? `<label class="sr" for="${id}">Store</label><select class="pill-select" id="${id}" data-store>
          <option value="">All stores</option>
          ${STORES.map(st => `<option value="${esc(st.id)}" ${st.id === filter ? "selected" : ""}>${esc(st.name)}</option>`).join("")}
        </select>` : ""}
        <label class="sr" for="${id}-period">Period</label><select class="pill-select" id="${id}-period" data-period>
          ${PERIODS.map(([d, l]) => `<option value="${d}" ${d === PERIOD ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        ${SOURCE === "database" ? `<span class="chip"><span class="dot"></span>All devices</span>` : `<span class="chip warn"><span class="dot"></span>This device only</span>`}
      </div>`;
    }

    // ---- View 1: the team ------------------------------------------------------
    function showOverview(keepScroll) {
      stopPlayer();
      setNav(TAB);
      const order = { help: 0, training: 1, new: 2, ready: 3 };
      const people = trainees().sort((a, b) => order[a.status] - order[b.status] || (b.last || "").localeCompare(a.last || ""));
      const filter = getFilter();
      const storeName = filter ? (STORES.find(s => s.id === filter) || {}).name : "";
      const scoped = ALL.filter(a => (!filter || a.storeId === filter) && people.some(p => p.trainee.id === a.trainee.id));
      const recentAll = scoped.filter(inPeriod);
      const challenges = recentAll.filter(a => a.mode !== "lesson");
      const count = s => people.filter(p => p.status === s).length;
      const activeWeek = new Set(scoped.filter(a => Date.now() - new Date(a.finishedAt).getTime() <= 7 * 864e5).map(a => a.trainee.id)).size;

      const kpi = (s, cls, icon, n, label, note) => `
        <button class="kpi ${cls} rise ${SHOW === s && s !== "all" ? "on" : ""}" data-show="${s}" aria-pressed="${SHOW === s && s !== "all"}" type="button">
          <span class="ic">${icon}</span>
          <span><div class="v">${n}</div><div class="l">${label}</div><div class="n">${note}</div></span>
        </button>`;

      app.innerHTML = `
        ${sourceBanner()}
        <section data-view="team" ${TAB === "team" ? "" : "hidden"}>
          <div class="page-head">
            <div><div class="eyebrow">${esc(storeName || (STORES.length > 1 ? `${STORES.length} stores` : "Your team"))}</div>
              <h1>Team readiness</h1><p>Who's ready, who's still training, and what to coach next.</p></div>
            ${headTools(filter, "store-filter")}
          </div>

          <div class="kpis">
            ${kpi("all", "k-all", ICON.people, people.length, "Trainees", `${activeWeek} practiced this week`)}
            ${kpi("ready", "k-ready", ICON.check, count("ready"), "Practice complete", "Ready for a trainer sign-off")}
            ${kpi("help", "k-help", ICON.coach, count("help"), "Need coaching", "Repeated misses lately")}
            ${kpi("training", "k-training", ICON.cap, count("training"), "Still in training", `${count("new")} not started yet`)}
          </div>

          <section class="card rise" style="--i:4" id="roster">
            <div class="card-head"><div><h2>Trainees</h2>
              <p class="sub">Practice complete = every lesson at 2+ stars and the latest try of every challenge passed. A trainer still signs off on the live register.</p></div></div>
            ${people.length ? `
            <div class="toolbar">
              <label class="search">${ICON.search}<input id="roster-search" type="search" placeholder="Search trainees" aria-label="Search trainees" value="${esc(QUERY)}" autocomplete="off" /></label>
              <div class="seg" role="group" aria-label="Show">
                ${[["all", "All", people.length], ["ready", "Complete", count("ready")], ["help", "Coaching", count("help")], ["training", "Training", count("training")], ["new", "New", count("new")]]
                  .map(([k, label, n]) => `<button type="button" data-show="${k}" class="${SHOW === k ? "on" : ""}" aria-pressed="${SHOW === k}">${label}<span class="n">${n}</span></button>`).join("")}
              </div>
            </div>
            <div class="people-head" aria-hidden="true">
              <span class="colhead">Trainee</span><span class="colhead">Status</span><span class="colhead">Lessons</span><span class="colhead">Challenges</span>
              <span class="colhead">Accuracy</span><span class="colhead">Speed</span><span class="colhead">Next step</span><span></span>
            </div>
            <ul class="people">${people.map(p => {
              const [step, why] = nextStep(p);
              return `
              <li class="person" data-id="${esc(p.trainee.id)}" data-name="${esc(p.trainee.name.toLowerCase())}" data-status="${p.status}">
                <div class="who">${avatar(p.trainee.name)}
                  <div style="min-width:0"><div class="name">${esc(p.trainee.name)}</div><div class="store-tag">${p.storeName && !filter ? esc(p.storeName) + " · " : ""}${p.last ? esc(ago(p.last)) : "never practiced"}</div></div></div>
                <div class="st">${statusPill(p.status)}</div>
                <div><span class="cell-l">Lessons</span><div class="mv"><span class="num">${p.lessonsSolid.length}<small>/${Lessons.list.length}</small></span></div>${pips(p)}</div>
                <div><span class="cell-l">Challenges</span><span class="num">${p.challengesClear.length}<small>/${Scenarios.list.length}</small></span><div class="store-tag">${p.challenges.length ? tries(p.challenges.length) : "none yet"}</div></div>
                <div><span class="cell-l">Accuracy</span>${rate(p.accurate, p.challenges.length, "challenges")}</div>
                <div><span class="cell-l">Speed</span>${rate(p.onTime, p.challenges.length, "challenges")}</div>
                <div class="next"><span class="cell-l">Next step</span><div class="next-step">${esc(step)}<small>${esc(why)}</small></div></div>
                <span class="chev">${ICON.chev}</span>
              </li>`;
            }).join("")}</ul>
            <p class="no-match" id="no-match" hidden>No trainees match.</p>`
            : `<p class="empty">No one has trained yet. Add trainees in <b>Manage</b>, give each their code, and they sign in at the Training Lab.</p>`}
          </section>


          <div class="cols halves section-gap">
            <section class="card rise" style="--i:5">
              <div class="card-head"><div><h2>Coach this next</h2><p class="sub">Most common mistakes in challenges, ${esc(periodLabel())}.</p></div></div>
              ${coachNext(challenges)}
            </section>
            <section class="card rise" style="--i:6">
              <div class="card-head"><div><h2>Recent practice</h2><p class="sub">Latest sessions. Press play to watch one back.</p></div>
                ${recentAll.length > 6 ? `<button class="link" type="button" data-goto="sessions">See all →</button>` : ""}</div>
              ${feed(recentAll.slice().sort((a, b) => b.finishedAt.localeCompare(a.finishedAt)).slice(0, 6), false)}
            </section>
          </div>

          <section class="card section-gap rise" style="--i:7">
            <div class="card-head"><div><h2>Challenge breakdown</h2><p class="sub">How each challenge is going across the team, ${esc(periodLabel())}. Use it to see which orders trip people up.</p></div></div>
            ${breakdown(challenges, people)}
          </section>

          <section class="card section-gap rise" style="--i:8">
            <div class="card-head"><div><h2>Practice activity</h2><p class="sub">Lessons and challenges finished each day.</p></div></div>
            ${activity(scoped)}
          </section>
        </section>

        <section data-view="trainees" ${TAB === "trainees" ? "" : "hidden"}>
          <div class="page-head">
            <div><div class="eyebrow">Progress</div><h1>Every lesson, every challenge</h1><p>One row per trainee. Tap a row for their details and replays.</p></div>
            ${headTools(filter, "store-filter-2")}
          </div>
          <section class="card">${matrix(people)}</section>
        </section>

        <section data-view="sessions" ${TAB === "sessions" ? "" : "hidden"}>
          <div class="page-head">
            <div><div class="eyebrow">Session replay</div><h1>Sessions</h1><p>Every lesson and challenge, ${esc(periodLabel())}, newest first.</p></div>
            ${headTools(filter, "store-filter-3")}
          </div>
          <section class="card">
            <div class="toolbar" style="margin-bottom:12px">
              <div class="seg" role="group" aria-label="Show sessions">
                ${[["all", "All"], ["challenge", "Challenges"], ["lesson", "Lessons"], ["fail", "Not passed"]]
                  .map(([k, l]) => `<button type="button" data-feed="${k}" class="${FEED === k ? "on" : ""}" aria-pressed="${FEED === k}">${l}</button>`).join("")}
              </div>
            </div>
            ${feed(recentAll.filter(a => FEED === "all" || (FEED === "lesson" ? a.mode === "lesson" : FEED === "challenge" ? a.mode !== "lesson" : a.mode !== "lesson" && !a.passed))
              .sort((a, b) => b.finishedAt.localeCompare(a.finishedAt)).slice(0, 150), true)}
          </section>
        </section>

        <section data-view="manage" ${TAB === "manage" ? "" : "hidden"}>
          <div class="page-head">
            <div><div class="eyebrow">Settings</div><h1>Manage</h1><p>Trainee codes, stores, and your results data.</p></div>
            ${headTools(filter, "store-filter-4")}
          </div>
          ${rosterSection(filter)}
          <section class="card danger-zone section-gap">
            <div class="card-head" style="margin-bottom:4px"><div><h2>Data</h2>
              <p class="sub">${SOURCE === "database" ? "Results from every device (shared database)." : "Results saved on this device."}</p></div></div>
            <div class="row"><p><b>Download results</b>A copy of every result as a JSON file.</p><button class="btn ghost small" id="export">Download</button></div>
            ${Storage.rejectedCount() ? `<div class="row"><p><b>Resend rejected results</b>Try again to send this device's rejected results.</p><button class="btn ghost small" id="retry">Resend</button></div>` : ""}
            ${SOURCE === "database" ? `<div class="row"><p><b>Sign out</b>Forget the manager code on this device.</p><button class="btn ghost small" id="signout">Sign out</button></div>` : ""}
            <div class="row"><p><b>${SOURCE === "database" ? "Delete shared results" : "Remove sent results from this device"}</b>Permanently removes results. This can't be undone.</p>
              <button class="btn danger small" id="clear">${SOURCE === "database" ? "Delete results…" : "Remove…"}</button></div>
          </section>
        </section>`;

      app.querySelectorAll("[data-id]").forEach(el => el.onclick = () => showTrainee(el.dataset.id));
      app.querySelectorAll("[data-attempt]").forEach(el => el.onclick = e => { e.stopPropagation(); showAttempt(el.dataset.attempt); });
      app.querySelectorAll("[data-goto]").forEach(el => el.onclick = () => { TAB = el.dataset.goto; showOverview(); });
      app.querySelectorAll("[data-feed]").forEach(el => el.onclick = () => { FEED = el.dataset.feed; showOverview(true); });
      app.querySelectorAll("[data-show]").forEach(el => el.onclick = () => {
        const isKpi = el.classList.contains("kpi");
        SHOW = isKpi && SHOW === el.dataset.show ? "all" : el.dataset.show;
        showOverview(true);
        if (isKpi) document.getElementById("roster").scrollIntoView({ behavior: "smooth", block: "start" });
      });
      const search = document.getElementById("roster-search");
      if (search) search.oninput = () => { QUERY = search.value; applyRosterFilter(); };
      applyRosterFilter();
      app.querySelectorAll("[data-store]").forEach(sel => sel.onchange = () => { setFilter(sel.value); showOverview(true); });
      app.querySelectorAll("[data-period]").forEach(sel => sel.onchange = () => { PERIOD = Number(sel.value); showOverview(true); });
      app.querySelectorAll(".bars .c").forEach(wireTip);
      wireRoster();
      document.getElementById("export").onclick = exportJSON;
      document.getElementById("clear").onclick = clearAll;
      const retry = document.getElementById("retry");
      if (retry) retry.onclick = async () => {
        retry.disabled = true;
        try { await Storage.retryRejected(); await load(); }
        catch (err) { alert("Couldn't resend: " + err.message); retry.disabled = false; }
      };
      const so = document.getElementById("signout");
      if (so) so.onclick = () => { setCode(null); load(); };
      if (!keepScroll) window.scrollTo(0, 0);
    }

    // Hides roster rows that don't match the search box and status filter.
    function applyRosterFilter() {
      const q = QUERY.trim().toLowerCase();
      let shown = 0;
      app.querySelectorAll(".people .person").forEach(li => {
        const ok = (!q || li.dataset.name.includes(q)) && (SHOW === "all" || li.dataset.status === SHOW);
        li.hidden = !ok;
        if (ok) shown++;
      });
      const none = document.getElementById("no-match");
      if (none) none.hidden = shown > 0;
    }

    // Top mistakes with counts, who made them, and the lesson that fixes each.
    function coachNext(challenges) {
      const top = countProblems(challenges, false).slice(0, 4);
      if (!top.length) return `<p class="empty">${challenges.length ? "No mistakes in this period. Nice." : "No challenge tries in this period."}</p>`;
      const people = Object.create(null);
      challenges.forEach(a => (a.mistakes || []).forEach(m => (people[m.code] = people[m.code] || new Set()).add(a.trainee.name)));
      return `<ul class="coach">${top.map(([code, n]) => {
        const lesson = Lessons.get(PRACTICE[code]);
        const names = [...people[code]];
        return `<li>
          <div class="top"><b>${esc(problem(code))}</b><span>${n} of ${tries(challenges.length)}</span></div>
          <div class="track"><div class="fill grow" style="width:${Math.max(3, pct(n, challenges.length))}%"></div></div>
          <div class="who-line"><span>${esc(names.slice(0, 3).join(", "))}${names.length > 3 ? ` +${names.length - 3}` : ""}</span>${lesson ? `<span>Practice: ${esc(lesson.title)}</span>` : code === "slow" ? "<span>More Playground reps</span>" : ""}</div>
        </li>`;
      }).join("")}</ul>
      <p class="foot-note">${tries(challenges.length)} by ${new Set(challenges.map(a => a.trainee.id)).size} trainees. A try can have more than one mistake.</p>`;
    }

    function feed(list, wide) {
      if (!list.length) return `<p class="empty">No sessions in this period.</p>`;
      return `<ul class="feed ${wide ? "wide" : ""}">${list.map(a => {
        const isLesson = a.mode === "lesson";
        const res = isLesson ? stars(a.stars || 0) : pill(a.passed ? "ready" : "fail", a.passed ? "✓" : "✗", a.score);
        const detail = isLesson
          ? `${a.hintsNeeded ? a.hintsNeeded + " hint" + (a.hintsNeeded > 1 ? "s" : "") : "no hints"} · ${Math.round(a.seconds)}s`
          : (a.mistakes.filter(m => m.code !== "slow").length ? a.mistakes.filter(m => m.code !== "slow").map(m => problem(m.code)).join(", ") : "no order mistakes") + ` · ${a.seconds.toFixed(1)}s`;
        return `<li>
          ${avatar(a.trainee.name)}
          <span class="what">${esc(a.trainee.name)} · ${isLesson ? "" : ""}${esc(a.scenarioTitle)}<small>${esc(ago(a.finishedAt))} · ${esc(detail)}</small></span>
          ${wide ? `<span class="res">${res}</span>` : ""}
          <span class="end">${wide ? "" : res}${replayBtn(a.id, a.scenarioTitle)}</span>
        </li>`;
      }).join("")}</ul>`;
    }

    // One row per challenge: tries, pass rate, first-try passes, time vs goal.
    function breakdown(challenges, people) {
      if (!challenges.length) return `<p class="empty">No challenge tries in this period.</p>`;
      const rows = Scenarios.list.map(s => {
        const ts = challenges.filter(a => a.scenarioId === s.id).sort((x, y) => x.finishedAt.localeCompare(y.finishedAt));
        const byPerson = new Map();
        ts.forEach(a => { if (!byPerson.has(a.trainee.id)) byPerson.set(a.trainee.id, a); });
        const first = [...byPerson.values()];
        const clear = people.filter(p => p.challengesClear.includes(s)).length;
        return { s, ts, passed: ts.filter(a => a.passed).length, first, firstPass: first.filter(a => a.passed).length,
          med: median(ts.map(a => a.seconds)), clear };
      });
      const judged = rows.filter(r => r.ts.length >= MIN_TRIES);
      const hardest = judged.length > 1 ? judged.reduce((h, r) => (r.passed / r.ts.length < h.passed / h.ts.length ? r : h)) : null;
      return `<div class="table-wrap"><table class="grid">
        <thead><tr><th>Challenge</th><th>Tries</th><th style="min-width:160px">Pass rate</th><th>First try</th><th>Typical time</th><th>Latest try passed</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr>
            <td><b>${esc(r.s.title)}</b>${r === hardest ? `<span class="hard">Hardest</span>` : ""}<small>${["", "Easy", "Medium", "Hard"][r.s.difficulty] || ""} · goal ${r.s.targetSeconds}s</small></td>
            <td class="num">${r.ts.length}</td>
            <td>${r.ts.length ? `<div class="bar"><div class="track"><div class="fill grow" style="width:${pct(r.passed, r.ts.length)}%"></div></div><span class="num">${pct(r.passed, r.ts.length)}%</span></div>
              <small>${r.passed} of ${r.ts.length}${r.ts.length < MIN_TRIES ? " · too few to judge" : ""}</small>` : `<small>Not tried</small>`}</td>
            <td>${r.first.length ? `<span class="num">${r.firstPass} of ${r.first.length}</span><small>trainees</small>` : "–"}</td>
            <td>${r.ts.length ? `<span class="num ${r.med <= r.s.targetSeconds ? "ok-t" : "slow-t"}">${r.med.toFixed(1)}s</span><small>${r.med <= r.s.targetSeconds ? "within goal" : `${(r.med - r.s.targetSeconds).toFixed(1)}s over`}</small>` : "–"}</td>
            <td><span class="num">${r.clear} of ${people.length}</span><small>trainees</small></td>
          </tr>`).join("")}</tbody></table></div>
        <p class="foot-note">First try = each trainee's first attempt in this period. Typical time is the median. Goal times are placeholders until experienced staff set them.</p>`;
    }

    // Sessions per day; a summary instead of a chart when there's too little.
    function activity(list) {
      const span = PERIOD && PERIOD <= 30 ? PERIOD : 30;
      const days = [];
      const today = new Date(); today.setHours(0, 0, 0, 0);
      for (let i = span - 1; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); days.push({ d, n: 0, c: 0 }); }
      list.forEach(a => {
        const t = new Date(a.finishedAt); t.setHours(0, 0, 0, 0);
        const slot = days.find(x => x.d.getTime() === t.getTime());
        if (slot) { slot.n++; if (a.mode !== "lesson") slot.c++; }
      });
      const total = days.reduce((s, x) => s + x.n, 0);
      const activeDays = days.filter(x => x.n).length;
      const people = new Set(list.filter(a => Date.now() - new Date(a.finishedAt).getTime() <= span * 864e5).map(a => a.trainee.id)).size;
      const label = d => d.toLocaleDateString([], { month: "short", day: "numeric" });
      const stats = `<div class="stat-row"><div><b>${total}</b>sessions, last ${span} days</div><div><b>${activeDays}</b>days with practice</div><div><b>${people}</b>trainees practiced</div></div>`;
      if (total < CHART_MIN || activeDays < 2) return stats + `<p class="hint-note">A daily chart appears once there are ${CHART_MIN}+ sessions on 2+ days.</p>`;
      const max = Math.max(...days.map(x => x.n));
      return stats + `<div class="bars" role="img" aria-label="Sessions per day for the last ${span} days, ${total} total">${days.map((x, i) => `
          <div class="c" tabindex="0" style="--i:${i}" data-tip="${esc(label(x.d))}: ${x.n} session${x.n === 1 ? "" : "s"}${x.n ? ` (${x.c} challenge${x.c === 1 ? "" : "s"})` : ""}"><i class="${x.n ? "" : "zero"}" style="height:${x.n ? Math.max(4, (100 * x.n) / max) : 2}%"></i></div>`).join("")}
          <span class="tip-pop" role="status"></span></div>
        <div class="bars-x"><span>${esc(label(days[0].d))}</span><span>Today</span></div>`;
    }
    function wireTip(c) {
      const tip = c.parentElement.querySelector(".tip-pop");
      const show = () => {
        tip.textContent = c.dataset.tip;
        const box = c.parentElement.getBoundingClientRect(), r = c.getBoundingClientRect();
        const x = Math.min(Math.max(r.left - box.left + r.width / 2, 60), box.width - 60);
        tip.style.left = `${x}px`; tip.style.top = `-6px`; tip.style.transform = "translate(-50%, -100%)";
        tip.classList.add("show");
      };
      c.addEventListener("mouseenter", show); c.addEventListener("focus", show); c.addEventListener("click", show);
      c.addEventListener("mouseleave", () => tip.classList.remove("show")); c.addEventListener("blur", () => tip.classList.remove("show"));
    }

    // Trainees x (7 lessons + 6 challenges): the whole team's progress at a glance.
    function matrix(people) {
      if (!people.length) return `<p class="empty">No trainees yet.</p>`;
      const head = (list, short) => list.map((x, i) => `<th title="${esc(x.title)}">${short}${i + 1}</th>`).join("");
      return `<div class="table-wrap"><table class="matrix">
        <thead><tr><th></th><th class="grp" colspan="${Lessons.list.length}">Lessons</th><th class="gap"></th><th class="grp" colspan="${Scenarios.list.length}">Challenges</th><th></th></tr>
          <tr><th></th>${head(Lessons.list, "L")}<th class="gap"></th>${head(Scenarios.list, "C")}<th></th></tr></thead>
        <tbody>${people.map(p => `<tr data-id="${esc(p.trainee.id)}">
          <td class="nm"><span class="who">${avatar(p.trainee.name)}<b>${esc(p.trainee.name)}</b></span></td>
          ${Lessons.list.map(l => {
            const ts = p.lessons.filter(a => a.scenarioId === l.id);
            const best = ts.reduce((b, a) => Math.max(b, a.stars || 0), 0);
            const cls = p.lessonsSolid.includes(l) ? "solid" : ts.length ? "part" : "";
            return `<td><span class="cell ${cls}" title="${esc(l.title)}: ${ts.length ? best + " stars, " + tries(ts.length) : "not started"}">${cls === "solid" ? "✓" : ts.length ? best + "★" : ""}</span></td>`;
          }).join("")}
          <td class="gap"></td>
          ${Scenarios.list.map(s => {
            const ts = p.challenges.filter(a => a.scenarioId === s.id);
            const last = ts[ts.length - 1];
            const cls = !last ? "" : last.passed ? "pass" : "fail";
            return `<td><span class="cell ${cls}" title="${esc(s.title)}: ${!last ? "not tried" : (last.passed ? "latest passed" : "latest not passed") + ", " + tries(ts.length)}">${!last ? "" : last.passed ? "✓" : "✗"}</span></td>`;
          }).join("")}
          <td>${statusPill(p.status)}</td>
        </tr>`).join("")}</tbody></table></div>
        <div class="legend"><span><span class="cell solid">✓</span>Lesson at 2+ stars</span><span><span class="cell part">1★</span>Tried, under 2 stars</span>
          <span><span class="cell pass">✓</span>Latest try passed</span><span><span class="cell fail">✗</span>Latest try not passed</span><span><span class="cell"></span>Not started</span></div>`;
    }

    // ---- Trainee codes ---------------------------------------------------------------
    function rosterSection(filter) {
      if (SOURCE !== "database") return `
        <section class="card"><h2>Trainee codes</h2>
          <p class="sub">Codes need the shared database. Connect it to add trainees and give them codes.</p></section>`;
      if (!ROSTER) return `
        <section class="card"><h2>Trainee codes</h2>
          <p class="sub">Not set up yet: run <b>supabase/003_trainee_codes.sql</b> in the Supabase SQL Editor, then reload this page.</p></section>`;
      const stores = STORES.filter(st => !filter || st.id === filter);
      return `
        <section class="card" id="codes">
          <h2>Trainee codes</h2>
          <p class="sub">Give each trainee their 4-digit code. They type it in the Training Lab, and every result is saved under them and their store. Turn a code off when someone leaves; their results stay.</p>
          ${stores.map(st => {
            const people = ROSTER.filter(r => r.storeId === st.id);
            return `
              <div class="codes-store"><h3>${esc(st.name)}</h3><button class="btn ghost small" data-rename="${esc(st.id)}">Rename</button></div>
              ${people.length ? `<ul class="codes">${people.map(r => `
                <li class="${r.active ? "" : "off"}">
                  <span>${esc(r.name)}${r.active ? "" : " (off)"}</span>
                  <span class="code" aria-label="Code">${esc(r.code)}</span>
                  <button class="btn ${r.active ? "ghost" : "soft"} small" data-toggle="${esc(r.id)}" data-active="${r.active ? "1" : ""}">${r.active ? "Turn off" : "Turn on"}</button>
                </li>`).join("")}</ul>` : `<p class="empty">No trainees yet.</p>`}`;
          }).join("")}
          <form class="add-trainee" id="add-trainee">
            <input id="new-name" maxlength="40" autocomplete="off" placeholder="First name + last initial" aria-label="Trainee name" />
            <select id="new-store" aria-label="Store">${STORES.map(st => `<option value="${esc(st.id)}" ${st.id === filter ? "selected" : ""}>${esc(st.name)}</option>`).join("")}</select>
            <button class="btn" type="submit">Add trainee</button>
          </form>
        </section>`;
    }


    function wireRoster() {
      const code = getCode();
      const form = document.getElementById("add-trainee");
      if (form) form.onsubmit = async e => {
        e.preventDefault();
        const name = document.getElementById("new-name").value.trim();
        if (!name) return document.getElementById("new-name").focus();
        try {
          const added = await Storage.addTrainee(code, document.getElementById("new-store").value, name);
          await loadRoster(code);
          showOverview(true);
          alert(`${object(added).name}'s trainee code is ${object(added).code}.`);
        } catch (err) { alert("Couldn't add: " + err.message); }
      };
      app.querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => {
        try {
          await Storage.setTraineeActive(code, b.dataset.toggle, !b.dataset.active);
          await loadRoster(code);
          showOverview(true);
        } catch (err) { alert("Couldn't change: " + err.message); }
      });
      app.querySelectorAll("[data-rename]").forEach(b => b.onclick = async () => {
        const store = STORES.find(st => st.id === b.dataset.rename);
        const name = prompt("New store name", store ? store.name : "");
        if (!name || !name.trim()) return;
        try {
          await Storage.renameStore(code, b.dataset.rename, name.trim());
          await loadRoster(code);
          showOverview(true);
        } catch (err) { alert("Couldn't rename: " + err.message); }
      });
    }

    // ---- View 2: one trainee -----------------------------------------------------
    function summarySentence(p) {
      if (!p.all.length) return "Hasn't practiced yet. Their first lesson is the Register tour.";
      const parts = [`Has ${p.lessonsSolid.length} of ${Lessons.list.length} lessons at 2+ stars and passed the latest try of ${p.challengesClear.length} of ${Scenarios.list.length} challenges.`];
      if (p.problems.length) parts.push(`Problem lately: <b>${esc(problem(p.problems[0][0]).toLowerCase())}</b> (${p.problems[0][1]} of their last ${p.recent.length} challenges).`);
      if (p.status !== "help" && p.status !== "ready" && p.passed.length === Scenarios.list.length && p.challengesClear.length < Scenarios.list.length) parts.push("Passed every challenge before, but failed the latest try of at least one.");
      return parts.join(" ");
    }

    // One of the three separate measures, as a card, with the team for context.
    function metricCard(label, n, d, unit, note, team) {
      n = num(n); d = num(d);
      const thin = d > 0 && d < MIN_TRIES;
      return `<div class="card mcard rise ${thin || !d ? "thin" : ""}" style="--i:2">
        <div class="m-label"><span>${esc(label)}</span>${thin ? `<span class="evidence" title="Fewer than ${MIN_TRIES} tries">Too few tries</span>` : ""}</div>
        ${d ? `<div class="m-big">${pct(n, d)}%<small> · ${n} of ${tries(d)}</small></div>
          <div class="track"><div class="fill grow" style="width:${pct(n, d)}%"></div></div>`
          : `<div class="m-big"><small>No ${esc(unit)} yet</small></div><div class="track"></div>`}
        <div class="m-note">${note}</div>
        ${team ? `<div class="team">${team}</div>` : ""}
      </div>`;
    }

    function showTrainee(id) {
      stopPlayer();
      setNav("team");
      const everyone = trainees();
      const p = everyone.find(x => x.trainee.id === id);
      if (!p) return showOverview();
      const history = p.all.slice().reverse();
      const latest = history[0];
      const teamCh = everyone.flatMap(x => x.challenges);
      const teamNote = (n, label) => teamCh.length >= MIN_TRIES ? `Team: ${pct(n, teamCh.length)}% ${label} (${tries(teamCh.length)})` : "";
      const [step, why] = nextStep(p);
      const callCls = p.status === "help" ? "help" : p.status === "ready" ? "ready" : "";

      app.innerHTML = `
        ${sourceBanner()}
        <button class="back-link" id="back" type="button">← All trainees</button>

        <section class="card hero-t rise">
          ${avatar(p.trainee.name, true)}
          <div style="min-width:0">
            <h1>${esc(p.trainee.name)} ${statusPill(p.status)}</h1>
            <div class="meta">${p.storeName ? esc(p.storeName) + " · " : ""}${p.last ? `Last practice ${esc(ago(p.last))} · ${tries(p.all.length)} in total` : "No practice yet"}</div>
          </div>
          <div class="hero-act">${latest ? `<button class="btn" data-attempt="${esc(latest.id)}" type="button">${ICON.play} Replay latest</button>` : ""}</div>
          <p class="summary">${summarySentence(p)}</p>
          <div class="callout ${callCls}"><span><b>Next step:</b> ${esc(step)}. <span style="opacity:.8">${esc(why)}.</span>${p.status === "ready" ? " A trainer watches them ring a few real orders before signing off." : ""}</span></div>
        </section>

        <div class="metrics3">
          <div class="card mcard rise" style="--i:1">
            <div class="m-label"><span>Training completion</span></div>
            <div class="m-big">${p.lessonsSolid.length}<small> of ${Lessons.list.length} lessons</small></div>
            ${pips(p)}
            <div class="m-note">${p.lessonsSolid.length} at 2+ stars · ${p.lessonsDone.length} tried · ${tries(p.lessons.length)}</div>
          </div>
          ${metricCard("Challenge accuracy", p.accurate, p.challenges.length, "challenges",
            p.challenges.length ? `Right items and right payment. Latest try passed on ${p.challengesClear.length} of ${Scenarios.list.length} challenges.` : "Shows after their first challenge.",
            teamNote(teamCh.filter(isAccurate).length, "accurate"))}
          ${metricCard("Speed", p.onTime, p.challenges.length, "challenges",
            p.challenges.length ? `Finished within the goal time. Typical time ${p.medianSeconds.toFixed(1)}s.` : "Shows after their first challenge.",
            teamNote(teamCh.filter(isOnTime).length, "on time"))}
        </div>

        <div class="cols halves section-gap">
          <section class="card rise" style="--i:3">
            <div class="card-head"><div><h2>Lesson path</h2><p class="sub">Filled = 2+ stars (counts toward Practice complete).</p></div></div>
            <ol class="lpath">${Lessons.list.map((l, i) => {
              const ts = p.lessons.filter(a => a.scenarioId === l.id);
              const best = ts.reduce((b, a) => Math.max(b, a.stars || 0), 0);
              const cls = p.lessonsSolid.includes(l) ? "solid" : ts.length ? "tried" : "";
              return `<li class="${cls}"><span class="node">${cls === "solid" ? "✓" : i + 1}</span>
                <span class="lt">${esc(l.title)}<small>${ts.length ? tries(ts.length) : "Not started"}</small></span>
                <span>${ts.length ? stars(best) : ""}</span></li>`;
            }).join("")}</ol>
          </section>
          <section class="card rise" style="--i:4">
            <div class="card-head"><div><h2>Challenges</h2><p class="sub">Latest try, best score and try count.</p></div></div>
            <ul class="checks">${Scenarios.list.map(s => {
              const ts = p.challenges.filter(a => a.scenarioId === s.id);
              const last = ts[ts.length - 1];
              const best = ts.length ? Math.max(...ts.map(a => a.score)) : null;
              return `<li><span class="mark ${!last ? "none" : last.passed ? "ok" : "no"}" aria-hidden="true">${!last ? "–" : last.passed ? "✓" : "✗"}</span>
                <span class="ct">${esc(s.title)}<small>${!last ? "Not tried" : last.passed ? "Latest try passed" : "Latest try not passed"}</small></span>
                <span class="right">${ts.length ? `best ${best} · ${tries(ts.length)}` : ""}</span></li>`;
            }).join("")}</ul>
          </section>
        </div>

        <div class="cols halves section-gap">
          <section class="card rise" style="--i:5">
            <div class="card-head"><div><h2>Challenge scores</h2>
              <p class="sub">${p.challenges.length >= CHART_MIN ? "Each dot is one try. Pass = right order + right payment + 80 or more." : `Every try so far. A trend chart appears after ${CHART_MIN} tries.`}</p></div></div>
            ${p.challenges.length >= CHART_MIN ? trendChart(p.challenges) : miniResults(p.challenges)}
          </section>
          <section class="card rise" style="--i:6">
            <div class="card-head"><div><h2>Problem areas</h2><p class="sub">Challenge tries (all time) with each mistake.</p></div></div>
            ${p.allProblems.length ? `<ul class="hbars">${p.allProblems.map(([code, n]) => `
              <li title="${esc(problem(code))}: ${n} of ${p.challenges.length}">
                <div class="top"><b style="font-weight:550">${esc(problem(code))}</b><span>${n} of ${p.challenges.length}</span></div>
                <div class="track"><div class="fill grow" style="width:${Math.max(3, pct(n, p.challenges.length))}%"></div></div>
              </li>`).join("")}</ul>` : `<p class="empty">${p.challenges.length ? "No order or payment mistakes." : "No challenges yet."}</p>`}
          </section>
        </div>

        <section class="card section-gap rise" style="--i:7" id="sessions">
          <div class="card-head"><div><h2>Sessions</h2><p class="sub">Newest first. Press play to watch any session tap by tap.</p></div></div>
          ${history.length ? `<ul class="feed wide">${history.map(a => `
            <li>
              <span class="kind ${a.mode === "lesson" ? "l" : "c"}" aria-hidden="true">${a.mode === "lesson" ? "L" : "C"}</span>
              <span class="what">${a.mode === "lesson" ? "Lesson: " : "Challenge: "}${esc(a.scenarioTitle)}
                <small>${esc(when(a.finishedAt))} · ${a.mode === "lesson"
                  ? `${a.hintsNeeded ? a.hintsNeeded + " hint" + (a.hintsNeeded > 1 ? "s" : "") : "no hints"} · ${a.wrongTaps || 0} wrong taps · ${Math.round(a.seconds)}s`
                  : (a.mistakes && a.mistakes.length ? a.mistakes.map(m => esc(problem(m.code))).join(" · ") : "No mistakes") + ` · ${a.seconds.toFixed(1)}s`}</small></span>
              <span class="res">${a.mode === "lesson" ? stars(a.stars || 0) : pill(a.passed ? "ready" : "fail", a.passed ? "✓" : "✗", a.score)}</span>
              ${replayBtn(a.id, a.scenarioTitle)}
            </li>`).join("")}</ul>` : `<p class="empty">No sessions yet.</p>`}
        </section>`;

      document.getElementById("back").onclick = () => { TAB = "team"; showOverview(); };
      app.querySelectorAll("[data-attempt]").forEach(b => b.onclick = () => showAttempt(b.dataset.attempt));
      wireChart();
      window.scrollTo(0, 0);
    }

    // Small result tiles for short histories (a 2-point "trend" means nothing).
    function miniResults(list) {
      if (!list.length) return `<p class="empty">No challenges yet.</p>`;
      return `<div class="minis">${list.slice().reverse().map(a => `
        <div class="mini" title="${esc(a.scenarioTitle)}">
          <span class="s ${a.passed ? "ok" : "no"}">${a.score}<small style="font-family:var(--text);font-size:.74rem;font-weight:550"> ${a.passed ? "✓ pass" : "✗ not yet"}</small></span>
          <small>${esc(a.scenarioTitle)}</small><small>${esc(day(a.finishedAt))} · ${a.seconds.toFixed(1)}s</small>
        </div>`).join("")}</div>`;
    }

    let CHART_ROWS = [];
    // Line chart of challenge scores, with the pass line at 80.
    function trendChart(list) {
      CHART_ROWS = list.map(a => ({ d: day(a.finishedAt), t: a.scenarioTitle, s: a.score, ok: a.passed, sec: a.seconds }));
      const W = 560, H = 230, L = 30, R = 10, T = 14, B = 26;
      const x = i => list.length === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (list.length - 1);
      const y = v => T + ((100 - v) * (H - T - B)) / 100;
      const pts = list.map((a, i) => [x(i), y(a.score)]);
      const grid = [0, 50, 100].map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("");
      const step = Math.max(1, Math.ceil(list.length / 5));
      const xlabels = list.map((a, i) => i % step === 0 || i === list.length - 1
        ? `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="${i === list.length - 1 ? "end" : i === 0 ? "start" : "middle"}">${esc(day(a.finishedAt))}</text>` : "").join("");
      const line = pts.map(p => p.join(",")).join(" ");
      const gap = list.length > 1 ? (W - L - R) / (list.length - 1) : 40;
      return `
        <div class="chart-wrap">
          <svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Challenge scores over time: ${list.length} tries, ${list.filter(a => a.passed).length} passed">
            <defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2747d1" stop-opacity="0.16"/><stop offset="1" stop-color="#2747d1" stop-opacity="0"/></linearGradient></defs>
            ${grid}
            <polygon class="area" points="${L},${y(0)} ${line} ${W - R},${y(0)}"/>
            <line class="passline" x1="${L}" x2="${W - R}" y1="${y(80)}" y2="${y(80)}"/>
            <polyline class="line" points="${line}"/>
            ${list.map((a, i) => `<rect class="hit" x="${pts[i][0] - gap / 2}" y="${T}" width="${gap}" height="${H - T - B}" data-i="${i}"/>
              <circle class="pt ${a.passed ? "" : "fail"}" cx="${pts[i][0]}" cy="${pts[i][1]}" r="5"/>`).join("")}
            ${xlabels}
          </svg>
          <div class="tip-pop" role="status"></div>
        </div>
        <div class="legend"><span><span class="dot"></span>Passed</span><span><span class="dot hollow"></span>Not passed</span><span><span class="dash"></span>Pass line (80)</span></div>`;
    }

    // Hover / tap tooltip for the trend chart.
    function wireChart() {
      const svg = app.querySelector(".trend");
      if (!svg) return;
      const rows = CHART_ROWS;
      const tip = app.querySelector(".chart-wrap .tip-pop");
      const dots = svg.querySelectorAll(".pt");
      const show = i => {
        const r = rows[i], dot = dots[i];
        dots.forEach(d => d.classList.remove("hot"));
        dot.classList.add("hot");
        tip.textContent = "";
        const b = document.createElement("b"); b.textContent = `${r.s} · ${r.ok ? "passed" : "not yet"}`;
        tip.append(b, document.createElement("br"), `${r.t}`, document.createElement("br"), `${r.d} · ${Number(r.sec).toFixed(1)}s`);
        const box = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
        tip.style.left = `${(dot.cx.baseVal.value / vb.width) * box.width}px`;
        tip.style.top = `${(dot.cy.baseVal.value / vb.height) * box.height}px`;
        tip.classList.add("show");
      };
      svg.querySelectorAll(".hit").forEach(h => {
        h.addEventListener("mouseenter", () => show(+h.dataset.i));
        h.addEventListener("click", () => show(+h.dataset.i));
      });
      svg.addEventListener("mouseleave", () => { tip.classList.remove("show"); dots.forEach(d => d.classList.remove("hot")); });
    }

    // ---- View 3: one attempt, replayed -------------------------------------------
    const CATEGORY_NAMES = {
      main: "Main Menu", cones: "Cones and Dishes", pints: "Pints and Quarts", sundaes: "Sundaes",
      shakes: "Shakes and Drinks", hurricanes: "Hurricanes", novelties: "Novelties", extras: "Extras",
      giftcards: "Gift Cards and Merch.", catering: "Catering and Misc.",
    };
    const SCREENS = { "manager-screen": "Manager", payment: "Payment", discount: "Discount" };

    function describe(e) {
      const d = e.data || {};
      switch (e.type) {
        case "challenge_started": case "lesson_started": return ["", "Tapped Start"];
        case "customer_said": return ["say", `Customer: “${d.text}”`];
        case "category_opened": return ["", `Opened ${CATEGORY_NAMES[d.category] || d.category}`];
        case "item_added": return ["", `Rang ${d.item}`];
        case "line_selected": return ["", `${d.selected ? "Highlighted" : "Un-highlighted"} line ${d.line} (${d.item})`];
        case "item_removed": return ["bad", `Deleted ${d.item}${d.method === "delete_last" ? " (last line)" : ""}`];
        case "order_cleared": return ["bad", `Delete All (${array(d.itemsRemoved).length} items)`];
        case "delete_on_empty_order": return ["bad", "Pressed Delete on an empty order"];
        case "empty_slot_tapped": return ["bad", "Tapped an empty spot"];
        case "screen_opened": return ["", `Opened ${SCREENS[d.screen] || d.screen}`];
        case "screen_closed": return ["", `Closed ${SCREENS[d.screen] || d.screen}`];
        case "discount_applied": return ["", `Discount ${d.kind === "percent" ? d.percent + "%" : "$" + d.amount}`];
        case "tender_applied": return ["pay", d.method === "pinpad" ? "Pay with Pinpad" : `Entered $${num(d.amount).toFixed(2)} cash (${String(d.method || "unknown").replace("_button", "")})`];
        case "custom_amount_invalid": return ["bad", "Invalid custom amount"];
        case "transaction_completed": return ["pay", `Sale completed: total $${num(d.total).toFixed(2)}, paid $${num(d.paid).toFixed(2)}, change $${num(d.change).toFixed(2)}`];
        case "coach_hint": return ["say", d.level >= 2 ? "Coach showed a tip" : "Coach made the button glow"];
        case "coach_wrong": return ["bad", "Wrong tap"];
        case "coach_restart": return ["bad", "Lesson restarted from checkpoint"];
        case "coach_step_done": return ["", `✓ Step ${d.step} done`];
        case "lesson_completed": return ["pay", "Lesson complete"];
        case "order_started": return ["", "New order"];
        default: return ["", e.type];
      }
    }

    function showAttempt(id) {
      stopPlayer();
      const a = ALL.find(x => x.id === id);
      if (!a) return showOverview();
      const t0 = a.events.length ? a.events[0].t : 0;
      const isLesson = a.mode === "lesson";
      const endIdx = a.events.findIndex(e => e.type === (isLesson ? "lesson_completed" : "transaction_completed"));
      const shown = endIdx === -1 ? a.events : a.events.slice(0, endIdx + 1);
      const sc = (label, v, max) => `<div class="sc"><div class="l">${esc(label)}</div><div class="v">${num(v)}<small>/${max}</small></div></div>`;

      app.innerHTML = `
        ${sourceBanner()}
        <button class="back-link" id="back" type="button">← ${esc(a.trainee.name)}</button>
        <section class="card rise">
          <div class="page-head" style="margin-bottom:0">
            <div><h1 style="font-size:1.6rem">${isLesson ? "Lesson: " : ""}${esc(a.scenarioTitle)}</h1>
              <p>${esc(a.trainee.name)} · ${when(a.finishedAt)} · ${a.seconds.toFixed(1)}s</p></div>
            <div>${isLesson ? stars(a.stars || 0) : pill(a.passed ? "ready" : "fail", a.passed ? "✓" : "✗", a.passed ? "Passed" : "Not yet")}</div>
          </div>
          ${isLesson ? `
            <ul class="checks" style="margin-top:12px">
              <li><span class="mark ${a.hintsNeeded ? "no" : "ok"}">${a.hintsNeeded ? "!" : "✓"}</span><span class="ct">Steps where the coach had to help</span><span class="right">${a.hintsNeeded || 0}</span></li>
              <li><span class="mark ${a.wrongTaps ? "no" : "ok"}">${a.wrongTaps ? "!" : "✓"}</span><span class="ct">Wrong taps</span><span class="right">${a.wrongTaps || 0}</span></li>
            </ul>` : `
            <div class="score-row">
              <div class="sc main"><div class="l">Score</div><div class="v">${a.score}<small>/100</small></div></div>
              ${sc("Order", a.points.accuracy, 50)}${sc("Payment", a.points.payment, 20)}
              ${sc("Corrections + speed", a.points.corrections + a.points.speed, 30)}
            </div>
            <ul class="feedback">${a.feedback.map(f => `<li class="${f.ok ? "ok" : "bad"}"><span aria-hidden="true">${f.ok ? "✓" : "✗"}</span><span>${esc(f.text)}</span></li>`).join("")}</ul>
            <div class="compare">
              <div><strong>Customer wanted</strong>${a.expected.map(i => `<div>${esc(i)}</div>`).join("")}</div>
              <div><strong>Trainee rang</strong>${a.rung.map(i => `<div>${esc(i)}</div>`).join("") || "<div>(nothing)</div>"}</div>
            </div>`}
        </section>
        <section class="card section-gap rise" style="--i:1">
          <div class="card-head">
            <div><h2>Replay: every tap, in order</h2><p class="sub">Press Play to watch it back at real speed (long pauses shortened).</p></div>
            ${shown.length ? `<button class="btn" id="play" type="button">▶ Play</button>` : ""}
          </div>
          <ul class="timeline" id="timeline">${shown.map(e => {
            const [cls, text] = describe(e);
            return `<li class="${cls ? "b-" + cls : ""}"><span class="t">${((e.t - t0) / 1000).toFixed(1)}s</span><span class="bullet" aria-hidden="true"></span><span class="${cls}">${esc(text)}</span></li>`;
          }).join("")}</ul>
        </section>`;

      document.getElementById("back").onclick = () => showTrainee(a.trainee.id);
      setNav("team");
      const play = document.getElementById("play");
      if (play) play.onclick = () => playReplay(shown, play);
      window.scrollTo(0, 0);
    }

    // Steps through the timeline, highlighting each tap as it happened.
    function playReplay(events, button) {
      const list = document.getElementById("timeline");
      const items = [...list.children];
      if (PLAYER) { stopPlayer(); list.classList.remove("playing"); items.forEach(li => li.classList.remove("seen", "now")); button.textContent = "▶ Play"; return; }
      list.classList.add("playing");
      items.forEach(li => li.classList.remove("seen", "now"));
      button.textContent = "■ Stop";
      let i = 0;
      const stepTo = () => {
        items.forEach(li => li.classList.remove("now"));
        if (i >= items.length) { PLAYER = null; button.textContent = "↻ Play again"; list.classList.remove("playing"); return; }
        items[i].classList.add("seen", "now");
        items[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
        const gap = i + 1 < events.length ? events[i + 1].t - events[i].t : 0;
        i++;
        PLAYER = setTimeout(stepTo, Math.min(1500, Math.max(250, gap)));
      };
      stepTo();
    }

    // ---- Data tools ----------------------------------------------------------------
    function exportJSON() {
      const blob = new Blob([JSON.stringify(ALL, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `training-results-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    async function clearAll() {
      const message = SOURCE === "database"
        ? "Delete results currently in the shared database and remove sent results from this device? This can't be undone. Pending and rejected results stay on this device. Unsent results on this or other devices may upload later and reappear."
        : "Remove sent results from this device? Pending and rejected results will be kept. This can't be undone.";
      if (!confirm(message)) return;
      try {
        if (SOURCE === "database") await Storage.clearAllAttempts(getCode());
        if (!Storage.clearAttempts()) throw new Error("Couldn't update this device's saved results.");
        load();
      } catch (err) {
        alert("Couldn't delete: " + err.message);
      }
    }

    load();
  </script>
</body>
